name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # Scoped to scripts/, which holds every shell file here: ergogen/ carries
      # none, and what it does carry from upstream are the two footprint
      # submodules. Each script sources lib/common.sh through a path built from
      # BASH_SOURCE, which shellcheck cannot resolve on its own: -x follows the
      # source and -P SCRIPTDIR tells it to look beside the script doing the
      # sourcing.
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x -P SCRIPTDIR
        with:
          scandir: "./scripts"

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      # eslint.config.mjs scopes this to the footprints written here rather
      # than pulled from the two upstream submodules.
      - name: Lint the footprints
        run: npm run lint

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"

      # Pinned in a manifest rather than installed by name, so Dependabot can
      # see the version and a ruff release cannot turn this red on a commit
      # that did not touch the sources.
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The pipeline scripts import pcbnew, which only exists inside KiCad's
      # own interpreter, so this checks them without running them.
      - name: Run ruff check
        run: ruff check scripts/ v4/onshape/gen-case.py

      - name: Run ruff format check
        run: ruff format --check scripts/ v4/onshape/gen-case.py
