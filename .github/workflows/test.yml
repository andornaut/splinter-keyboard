name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3
      - name: Run test
        shell: bash
        run: |
          set -euo pipefail
          source tests/container/stock
          stock_begin "$PWD"
          stock_image python_image "python:$(cat .python-version)"
          stock_run "${python_image}" '' -- sh -ec '
          version=$(python -c "import json; print(json.load(open(\"package.json\"))[\"config\"][\"VERSION\"])")
          npm_package_config_VERSION="$version" python scripts/validate-provenance.py
          '
          stock_finish

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker
        uses: docker/setup-docker-action@v5.7.0
        with:
          version: v29.9.3
      - name: Run lint
        shell: bash
        run: |
          set -euo pipefail
          source tests/container/stock
          stock_begin "$PWD"
          stock_image node_image "node:$(sed 's/^v//' .nvmrc)"
          stock_image python_image "python:$(cat .python-version)"
          stock_image shellcheck_image koalaman/shellcheck:v0.11.0
          stock_prepare "${node_image}" node -- sh -ec '
          mkdir -p /scratch/node
          cp package.json package-lock.json /scratch/node/
          HUSKY=0 npm ci --prefix /scratch/node --ignore-scripts --maxsockets=1 --no-audit --no-fund >&2
          tar --create --file - --directory / scratch/node
          '
          stock_prepare "${python_image}" python -- sh -ec '
          python -m venv /scratch/venv >&2
          /scratch/venv/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt >&2
          tar --create --file - --directory / scratch/venv
          '
          stock_run "${node_image}" node -- sh -ec '
          ln -s /scratch/node/node_modules node_modules
          npm run lint
          /scratch/node/node_modules/.bin/markdownlint-cli2
          '
          stock_run "${python_image}" python -- sh -ec '
          /scratch/venv/bin/ruff check .
          /scratch/venv/bin/ruff format --check .
          '
          "${git_metadata[@]}" -C "${checkout}" ls-files --cached --others --exclude-standard -z -- '*.sh' > "${scratch}/shell-files.list"
          shell_files=()
          while IFS= read -r -d '' shell_file; do
              case "${shell_file}" in node_modules/*|ergogen/*|.husky/*) continue ;; esac
              if [[ -f ${checkout}/${shell_file} && ! -L ${checkout}/${shell_file} ]]; then shell_files+=("${shell_file}"); fi
          done < "${scratch}/shell-files.list"
          stock_readonly "${shellcheck_image}" /bin/shellcheck -x -P SCRIPTDIR "${shell_files[@]}" \
              tests/container/stock tests/container/check-stock tests/container/node tests/container/python
          stock_finish
