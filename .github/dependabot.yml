version: 2
updates:
  # The vendored ergogen footprint libraries, which this repository tracks but
  # does not maintain. Without this nothing proposes a bump and the pins move
  # only when someone remembers to move them.
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # requirements-dev.txt holds the lint gate's tooling. Nothing here runs on a
  # host: the pipeline scripts reach Python through KiCad's own interpreter.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  # A standing Dependabot alert on makerjs cannot be closed from here: ergogen
  # 4.2.1 requires makerjs ^0.18.1, and the patched 0.19.2 falls outside that
  # range, so nothing can propose the bump until ergogen widens its
  # requirement. makerjs runs locally to generate the board and serves nothing.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
