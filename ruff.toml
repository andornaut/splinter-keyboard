# Matches ai-maintainer and keylight, the other repositories linted with ruff
# here. The sources were written wider than ruff's 88-column default, and
# reflowing them buys nothing.
line-length = 120

# The two vendored footprint libraries are upstream's, and the versioned
# ergogen directory reaches them again through symlinks. Excluded here rather
# than by naming paths on the command line, so a script added anywhere else is
# covered without an edit to the gate.
#
# extend-exclude, not exclude: the latter replaces ruff's own list, which is
# what keeps it out of node_modules. A checkout without this machine's global
# gitignore - CI, or anyone else's - has nothing else stopping it walking in.
extend-exclude = [
    "ergogen/footprints/ceoloide",
    "ergogen/footprints/infused-kim",
    "ergogen/kb_ergogen_helper",
    "v*/ergogen",
]
