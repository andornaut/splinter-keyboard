# Matches ai-maintainer and keylight, the other repositories linted with ruff
# here. The sources were written wider than ruff's 88-column default, and
# reflowing them buys nothing.
line-length = 120

# The two vendored footprint libraries are upstream's, and the versioned
# ergogen directory reaches them again through symlinks. Excluded here rather
# than by naming paths on the command line, so a script added anywhere else is
# covered without an edit to the gate.
#
# extend-exclude, not exclude: the latter replaces ruff's own list, which is
# what keeps it out of node_modules. A checkout without this machine's global
# gitignore - CI, or anyone else's - has nothing else stopping it walking in.
extend-exclude = [
    "ergogen/footprints/ceoloide",
    "ergogen/footprints/infused-kim",
    "ergogen/kb_ergogen_helper",
    "v*/ergogen",
]

[lint]
# Every rule ruff has, then what is given up and why. The version is pinned in
# each gate's manifest, so this set only moves when a commit moves it.
select = ["ALL"]
ignore = [
    # Mandates rather than checks: an annotation on every signature, a docstring
    # on every module and function, a copyright header on every file.
    "ANN",
    "D",
    "CPY",
    # The formatter owns commas and quoting; ruff documents these as conflicting
    # with it.
    "COM",
    # Bans print(). These are command line scripts, where print is the output.
    "T20",
    # Style preferences about call shape and where an exception's message lives.
    "FBT",
    "EM",
    "TRY003",
    "PLR2004",
    # Size and complexity ceilings. Worth watching, not worth failing a build on,
    # and the Go gates here give up the same ones.
    "C901",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    # Mandate a control-flow shape: a return moved into an else, a raise
    # hoisted into its own function, a try that may not sit in a loop.
    "TRY300",
    "TRY301",
    "PERF203",
    # os.path is correct and not deprecated. Rewriting it to pathlib changes the
    # type flowing through these scripts, and none of them has a test that would
    # catch a bad rewrite.
    "PTH",
]

[lint.per-file-ignores]
# A test asserts, reaches into the unit it covers, and writes stubs whose
# arguments exist to match a signature rather than to be read.
"**/test_*.py" = ["ARG", "S101", "SLF001"]
"**/*_test.py" = ["ARG", "S101", "SLF001"]

# Local to this repository. The pipeline drives KiCad, npm and git, which is
# what most of these describe as a risk rather than as a mistake.
"scripts/**/*.py" = [
    # Running a subprocess, and finding it on PATH, is the job.
    "S603",
    "S607",
    # npm_package_config_VERSION is npm's own spelling, passed in by npm.
    # Capitalising it would look for a variable nothing sets.
    "SIM112",
]
"v4/onshape/*.py" = [
    # sys.path is extended before the Onshape client is imported, so those
    # imports cannot precede it.
    "E402",
]
